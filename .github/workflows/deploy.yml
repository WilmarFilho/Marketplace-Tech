name: Deploy Marketplace

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Entrar na pasta do projeto
            mkdir -p ~/Marketplace-Tech
            cd ~/Marketplace-Tech
            
            # 2. Sincronizar com o commit atual
            if [ ! -d ".git" ]; then
              echo "Repositório não encontrado localmente. Clonando..."
              git clone https://github.com/WilmarFilho/Marketplace-Tech.git .
            else
              echo "Sincronizando repositório existente..."
              git fetch origin main
              git reset --hard origin/main
            fi

            # --- MELHORIA: BUILD E DEPOIS LIMPEZA ---
            echo "Iniciando build e deploy com Docker Compose V2..."
            
            # Mudamos para 'docker compose' (sem hífen)
            # O build é feito primeiro. Se o build falhar, o site antigo continua no ar.
            docker-compose up -d --build --force-recreate

            # Agora limpamos o que sobrou
            echo "Limpando recursos antigos..."
            
            # Remove imagens que ficaram sem tag (dangling images) do build anterior
            docker image prune -f
            
            # Opcional: remove volumes órfãos (cuidado se tiver banco de dados no docker)
            # docker volume prune -f
